<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Railway Transfer Hologram</title>
  <!-- AR.js and A-Frame libraries -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #overlay-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #00ffcc;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 9999;
      text-align: center;
      border: 1px solid #00ffcc;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="overlay-hint">✨ Move your phone slowly around to view the hologram</div>

  <!-- A-Frame VR / AR scene running camera feed -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;">
    
    <a-assets>
      <!-- Place your poster image in the same folder named poster.png -->
      <img id="poster" src="poster.png" />
    </a-assets>

    <!-- Camera entity -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Holographic Floating Plane placed directly in front of the viewer -->
    <a-entity position="0 0 -2.5">
      <!-- Glow backlight plate for 3D/4D hologram effect -->
      <a-plane 
        width="1.8" 
        height="3.0" 
        color="#00e5ff" 
        opacity="0.25" 
        material="transparent: true; side: double;"
        animation="property: scale; dir: alternate; dur: 1500; to: 1.05 1.05 1.05; loop: true;">
      </a-plane>

      <!-- The Transfer Request Poster -->
      <a-plane 
        src="#poster" 
        width="1.6" 
        height="2.8" 
        material="transparent: true; roughness: 0.2; metalness: 0.1;"
        animation="property: position; dir: alternate; dur: 2000; to: 0 0.08 0; easing: easeInOutSine; loop: true;">
      </a-plane>
    </a-entity>

  </a-scene>
</body>
</html>
